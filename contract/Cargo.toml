[package]
name = "agentguard-log"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned exactly: the contract is written against the 5.1 #[near_bindgen]
# API; near-sdk >= 5.13 resolves under "^5.1" but requires the new #[near]
# macro style (ContractState derive) and breaks this code.
near-sdk = "=5.1.0"
# Direct dependency because near-sdk's Borsh derive macros look `borsh` up
# in this crate's own manifest (proc_macro_crate) when compiling tests.
borsh = "1"

# Unit tests build near-sdk for the host target, which near-sdk only allows
# with the unit-testing feature. Dev-dependency scoping keeps that feature
# out of the deployed wasm build.
[dev-dependencies]
near-sdk = { version = "=5.1.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
