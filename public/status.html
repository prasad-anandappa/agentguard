<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGuard — status</title>
<style>
  :root{--bg:#0b0f14;--card:#131a22;--line:#243040;--txt:#e8eef4;--dim:#93a5b5;--ok:#2fbf71;--bad:#ef4b4b;--acc:#00ec97}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:26px;margin:0 0 4px}h1 .g{color:var(--acc)}
  .muted{color:var(--dim);font-size:13.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card span{display:block;color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
  .card b{font-size:19px}
  .ok{color:var(--ok)}.bad{color:var(--bad)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
  a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Agent<span class="g">Guard</span> — status</h1>
  <p class="muted">Liveness proof for the hosted demo. Auto-refreshes every 30 seconds. <a href="/">← demo</a> · <a href="/verify">verify ↗</a></p>
  <div class="grid" aria-live="polite">
    <div class="card"><span>Service</span><b id="sService">…</b></div>
    <div class="card"><span>Uptime</span><b id="sUptime">…</b></div>
    <div class="card"><span>Anchor mode</span><b id="sAnchor">…</b></div>
    <div class="card"><span>Hash chain</span><b id="sChain">…</b></div>
    <div class="card"><span>Decision-log contract</span><b class="mono" id="sContract">…</b></div>
    <div class="card"><span>Contract decisions (on-chain)</span><b id="sHeight">…</b></div>
    <div class="card"><span>Decisions in the log</span><b id="sDecisions">…</b></div>
    <div class="card"><span>Last anchored entry</span><b id="sLast">…</b></div>
  </div>
  <p class="muted" id="sChecked"></p>
</div>
<script>
const $=id=>document.getElementById(id);
function human(sec){const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return (d?d+'d ':'')+(h?h+'h ':'')+(m?m+'m ':'')+s+'s'}
function age(iso){const sec=Math.max(0,Math.round((Date.now()-Date.parse(iso))/1000));return human(sec)+' ago'}
async function load(){
  try{
    const s=await (await fetch('/api/status')).json();
    $('sService').innerHTML='<span class="ok">● live</span>';
    $('sUptime').textContent=human(s.uptimeSeconds);
    $('sAnchor').textContent=s.anchorMode;
    $('sChain').innerHTML=(s.chain&&s.chain.ok)?'<span class="ok">✓ valid</span>':'<span class="bad">✗ broken</span>';
    $('sContract').innerHTML=s.contractId?('<a href="https://testnet.nearblocks.org/address/'+s.contractId+'" target="_blank" rel="noopener">'+s.contractId+'</a>'):'—';
    $('sHeight').textContent=s.contractDecisions===null||s.contractDecisions===undefined?'unavailable':s.contractDecisions;
    $('sDecisions').textContent=s.decisions;
    $('sLast').innerHTML=s.lastAnchored?('#'+s.lastAnchored.seq+' '+s.lastAnchored.verdict+' · '+age(s.lastAnchored.entryTs)+' · <a href="'+s.lastAnchored.explorerUrl+'" target="_blank" rel="noopener">tx ↗</a>'):'none yet';
    $('sChecked').textContent='Checked '+new Date().toUTCString()+' · network: NEAR testnet';
  }catch(err){
    $('sService').innerHTML='<span class="bad">● unreachable</span>';
  }
}
load();setInterval(load,30000);
</script>
</body>
</html>
